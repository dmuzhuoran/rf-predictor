<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GPSD Clinical Subtype · Online Prediction</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{
      --bg:#f8fafc;
      --card-bg:#ffffff;
      --bd:#e5e7eb;
      --txt:#0f172a;
      --muted:#64748b;
      --accent:#2563eb;
      --accent-weak:#dbeafe;
      --shadow:0 6px 20px rgba(2,6,23,.08);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
      color:var(--txt);
      line-height:1.65;
      margin:32px auto;
      max-width:1100px;
      background:radial-gradient(1200px 600px at 10% -10%, #eef2ff 0%, transparent 50%),
                 radial-gradient(1000px 500px at 120% 10%, #e0f2fe 0%, transparent 55%),
                 var(--bg);
    }

    .header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:8px 0 12px;padding:8px 0}
    .title{
      font-size:32px;font-weight:900;letter-spacing:.2px;margin:0;
      background:linear-gradient(90deg,#0f172a,#2563eb 60%,#0ea5e9);
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }

    .card{background:var(--card-bg);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:14px 0;box-shadow:var(--shadow);transition:transform .15s ease, box-shadow .15s ease}
    .card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(2,6,23,.12)}

    .row{display:flex;flex-wrap:wrap;gap:14px}
    .col{flex:1 1 320px}

    label{font-size:12px;font-weight:800;display:block;margin-bottom:8px;letter-spacing:.3px;color:var(--muted);text-transform:uppercase}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}

    input,select,textarea{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;font-size:14px;background:#fff;transition:border-color .15s ease, box-shadow .15s ease}
    input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-weak)}
    textarea{min-height:160px;resize:vertical}

    button,.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--bd);background:#fff;padding:11px 18px;border-radius:999px;font-weight:800;cursor:pointer;text-decoration:none;transition:transform .08s ease, box-shadow .12s ease, background .12s ease, color .12s ease,border-color .12s ease}
    button:active,.btn:active{transform:translateY(1px)}
    .primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 16px rgba(37,99,235,.25)}
    .primary:hover{filter:brightness(1.05)}
    .muted{background:#f3f4f6}
    button:disabled,.btn[disabled]{opacity:.55;cursor:not-allowed}

    #loadBtn { padding: 16px 28px; font-size: 18px; }

    .inputs-3{display:grid;grid-template-columns:repeat(3,minmax(140px,1fr));gap:12px}
    @media (max-width:720px){.inputs-3{grid-template-columns:1fr}}
    .inputs-3 label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: none; }
    .single-actions { margin-top: 12px; }

    .tabs { display:flex; gap:8px; border-bottom:1px solid var(--bd); padding:0 6px 6px 6px; margin:6px 0 10px; }
    .tab-btn { border:none; background:transparent; padding:10px 14px; border-radius:10px; font-weight:800; color:var(--muted); cursor:pointer; }
    .tab-btn[aria-selected="true"]{ background:var(--accent-weak); color:var(--txt); }
    .panel { display:none; }
    .panel.active { display:block; }

    .img-wrap{ display:flex; justify-content:center; align-items:center; background:#fff; border:1px dashed var(--bd); border-radius:12px; padding:10px; min-height:240px;}
    .img-wrap img{ max-width:100%; max-height:520px; border-radius:12px; }

    .note-text { white-space:pre-line; font-size:14px; color:#0f172a; line-height:1.7; }
    .help { font-size:12px; color:var(--muted); margin-top:6px;}
  </style>
</head>
<body>

  <div class="header">
    <h1 class="title">GPSD Clinical Subtype – Online Prediction</h1>
    <div class="row" style="gap:10px;">
      <button id="loadBtn" class="primary">Load Model</button>
      <button id="tplBtn" class="muted">Template</button>
    </div>
  </div>

  <div class="tabs" role="tablist" aria-label="Main Tabs">
    <button id="tabPredict" class="tab-btn" role="tab" aria-selected="true" aria-controls="panel-predict">Predict</button>
    <button id="tabNotes" class="tab-btn" role="tab" aria-selected="false" aria-controls="panel-notes">Notes</button>
  </div>

  <div id="panel-predict" class="panel active" role="tabpanel" aria-labelledby="tabPredict">
    <div class="container">
      <div class="card">
        <label>Parameters(default)</label>
        <div class="inputs-3">
          <div>
            <label for="wInput">Fusion Weight (w)</label>
            <input id="wInput" type="number" min="0" max="1" step="0.01" value="0.70" aria-label="Fusion Weight (w)">
          </div>
          <div>
            <label for="alphaInput">Distance Temperature (α)</label>
            <input id="alphaInput" type="number" step="0.1" value="1.0" aria-label="Distance Temperature (α)">
          </div>
          <div>
            <label for="rejInput">Reject Threshold</label>
            <input id="rejInput" type="number" min="0" max="1" step="0.01" value="0.7" aria-label="Reject Threshold">
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col">
          <div class="card">
            <label>Single Case</label>
            <form id="inputForm"></form>
            <div class="row single-actions">
              <button id="predictBtn" class="primary" disabled>Predict</button>
              <button id="resetBtn" class="muted" disabled>Reset</button>
              <span id="predState" class="mono"></span>
            </div>
          </div>
        </div>
        <div class="col">
          <div class="card">
            <label>Batch CSV</label>
            <input id="csvFile" type="file" accept=".csv,text/csv">
            <div class="row" style="margin-top:12px;">
              <button id="batchBtn" class="primary" disabled>Run Batch</button>
              <a id="dlLink" class="btn muted" style="display:none" download="batch_predictions.csv">Download</a>
              <span id="batchState" class="mono"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <label>Results</label>
        <div id="result" class="mono" style="min-height:120px;padding:6px 2px;">
          <div style="color:var(--muted);">No results yet</div>
        </div>
      </div>
    </div>
  </div>

  <div id="panel-notes" class="panel" role="tabpanel" aria-labelledby="tabNotes">
    <div class="container">
      <div class="card">
        <div class="row">
          <div class="col">
            <div class="img-wrap">
              <img src="./42527242-8e74-4861-887b-7d9b329c700e.jpg" alt="Default note image">
            </div>
          </div>
          <div class="col">
            <!-- NOTE_TEXT_START -->
            <div id="note-container" class="note-text"></div>

<script>
fetch("note.txt")   // 路径相对于 index.html
  .then(response => response.text())
  .then(text => {
    document.getElementById("note-container").innerText = text;
  })
  .catch(err => {
    document.getElementById("note-container").innerText = "⚠️ Failed to load notes.";
    console.error(err);
  });
</script>

            <!-- NOTE_TEXT_END -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const tabs = {
      predict: { btn: document.getElementById('tabPredict'), panel: document.getElementById('panel-predict') },
      notes:   { btn: document.getElementById('tabNotes'),   panel: document.getElementById('panel-notes') }
    };

    function setTab(name){
      for (const [key, obj] of Object.entries(tabs)){
        const active = (key === name);
        obj.btn.setAttribute('aria-selected', active ? 'true' : 'false');
        obj.panel.classList.toggle('active', active);
      }
      const hash = name === 'predict' ? '' : '#notes';
      history.replaceState(null, '', hash || location.pathname);
    }

    tabs.predict.btn.addEventListener('click', () => setTab('predict'));
    tabs.notes.btn.addEventListener('click', () => setTab('notes'));

    if (location.hash === '#notes') setTab('notes');
  </script>

  <script type="module" src="./app.js"></script>
</body>
</html>
